<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <link rel="apple-touch-icon" href="../assets/images/app-icon-192.png" />
    <meta name="theme-color" content="#0b0d0e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Commando Club" />
    <meta name="description" content="Build and manage demo surveys for Commando Fittness Club." />
    <title>Survey Builder | Commando Fittness Club</title>
    <link rel="icon" type="image/png" href="../assets/images/app-icon-192.png" />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/admin.css" />
    <script type="module" src="../js/data.js"></script>
    <script type="module" src="../js/components.js"></script>
    <script type="module" src="../js/admin/guard.js"></script>
    <script type="module" src="../js/admin/surveys.js"></script>
  </head>
  <body class="admin-page" data-page="admin-surveys" style="visibility:hidden">
    <header class="admin-topbar"><a class="brand-wrap" href="index.html"><img src="../GYM%20LOGO/GYM%20LOGO.png" alt="" />Commando Fittness Club <span class="admin-brand-label">Admin</span></a><nav class="admin-nav" aria-label="Admin navigation"><a href="index.html">Dashboard</a><a href="machines.html">Machines</a><a href="fees.html">Fees</a><a href="notifications.html">Notifications</a><a href="surveys.html" class="active">Surveys</a><a href="responses.html">Responses</a><a href="enquiries.html">Enquiries</a></nav><button class="btn btn-primary" id="new-survey-btn" type="button">+ New survey</button></header>
    <main class="admin-shell survey-manager">
      <section class="admin-hero"><div><span class="eyebrow accent">Workspace</span><h1>Surveys</h1><p>Published surveys are visible to visitors when they open or refresh the website.</p></div><button class="btn btn-secondary" id="refresh-surveys-btn" type="button">Refresh list</button></section>
      <section class="survey-toolbar" aria-label="Survey list controls">
        <label class="survey-search"><span class="sr-only">Search surveys</span><input id="survey-search" type="search" placeholder="Search surveys…" /></label>
        <label class="survey-filter"><span class="sr-only">Filter surveys by status</span><select id="survey-status-filter"><option value="all">All surveys</option><option value="Published">Published</option><option value="Draft">Draft</option></select></label>
        <p id="survey-count" class="survey-count" aria-live="polite"></p>
      </section>
      <section id="admin-surveys-list" class="survey-list"></section>
      <div id="surveys-empty" class="survey-empty" hidden><strong>No surveys found</strong><span>Try another search or create your first survey.</span></div>
      <p id="survey-list-status" class="status-text" aria-live="polite"></p>
    </main>
    <dialog id="survey-modal" class="admin-modal wide-modal"><form id="survey-form" method="dialog"><div class="modal-head"><h2>Survey builder</h2><button class="icon-button" type="button" data-close-modal="survey-modal" aria-label="Close">×</button></div><label><span>Survey title</span><input name="title" required /></label><label><span>Description</span><textarea name="description" rows="2" required></textarea></label><div id="question-builder" class="question-builder"></div><div class="builder-tools"><button class="btn btn-secondary" type="button" id="add-question-btn">Add question</button><label class="checkbox-label"><input type="checkbox" name="publish" /> Publish</label></div><div class="modal-actions"><button class="btn btn-secondary" type="button" data-close-modal="survey-modal">Cancel</button><button class="btn btn-primary" type="submit">Save draft</button></div></form></dialog>
    <script defer src="../js/pwa.js"></script>
  </body>
</html>
